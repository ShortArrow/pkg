name: poll

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  poll:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start a publishing run for each unpublished release
        run: |
          pwsh -File scripts/find-unpublished.ps1 | while read -r repository tag; do
            echo "Starting publish $repository $tag"
            gh workflow run publish.yml -f operation=publish -f repository="$repository" -f tag="$tag"
          done
